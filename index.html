<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Remedial Claim Portal</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #0056b3;
            --accent-color: #28a745;
            --danger-color: #dc3545;
            --border-color: #e0e0e0;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #375a7f;
            --accent-color: #2b8a3e;
            --danger-color: #e03131;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: var(--accent-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }

        /* Weeks Grid Layout */
        .weeks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .week-toggle-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .week-toggle-card.open {
            border-left: 5px solid var(--accent-color);
        }

        .week-toggle-card.closed {
            border-left: 5px solid var(--danger-color);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .open .status-badge { background-color: rgba(40, 167, 69, 0.2); color: var(--accent-color); }
        .closed .status-badge { background-color: rgba(220, 53, 69, 0.2); color: var(--danger-color); }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>School Remedial Management Portal</h2>
        <button id="themeToggle" class="btn tab-btn">Toggle Dark Mode</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('teacherView')">Teacher Claim Portal</button>
        <button class="tab-btn" onclick="switchTab('adminView')">Admin Control Portal</button>
    </div>

    <!-- TEACHER PORTAL -->
    <div id="teacherView" class="tab-content active">
        <div class="card">
            <h3>Submit Remedial Claim</h3>
            <form id="remedialForm">
                <div class="form-group">
                    <label for="teacherName">Teacher Name:</label>
                    <input type="text" id="teacherName" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="claimWeekSelect">Select Claim Week:</label>
                    <select id="claimWeekSelect" required>
                        <option value="">-- Select an Open Week --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subjectName">Subject / Class:</label>
                    <input type="text" id="subjectName" placeholder="e.g., Mathematics - Grade 10" required>
                </div>

                <div class="form-group">
                    <label for="sessionDate">Date of Session:</label>
                    <input type="date" id="sessionDate" required>
                </div>

                <div class="form-group">
                    <label for="hoursTaught">Hours Taught:</label>
                    <input type="number" id="hoursTaught" min="1" max="10" placeholder="1" required>
                </div>

                <button type="submit" class="btn btn-success">Submit Claim</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PORTAL -->
    <div id="adminView" class="tab-content">
        <!-- Week Management Card -->
        <div class="card">
            <h3>Manage Claim Weeks (Weeks 1 - 9)</h3>
            <p>Open or close specific weeks for teachers to submit claims, or initialize new week entries.</p>
            
            <div style="display: flex; gap: 10px; max-width: 400px; margin-bottom: 15px;">
                <input type="number" id="newWeekInput" min="1" max="9" placeholder="Enter week (1-9)">
                <button type="button" id="addWeekBtn" class="btn btn-primary">Add / Open Week</button>
            </div>

            <div id="adminWeeksList" class="weeks-grid">
                <!-- Dynamically populated week toggle cards -->
            </div>
        </div>

        <!-- Submitted Claims Verification Card -->
        <div class="card">
            <h3>Submitted Claims Verification</h3>
            <div id="claimsSummary">
                <p>No claims logged yet.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Tab Switching Functionality
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Dark Mode Toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
    });

    // Initialize Default Weeks (1 to 9) in LocalStorage
    function initializeWeeks() {
        let weeks = JSON.parse(localStorage.getItem('remedial_weeks'));
        if (!weeks) {
            weeks = {};
            for (let i = 1; i <= 9; i++) {
                weeks[i] = { weekNumber: i, isOpen: false }; // Default state closed
            }
            localStorage.setItem('remedial_weeks', JSON.stringify(weeks));
        }
        return weeks;
    }

    // Render Admin Week Controls
    function renderAdminWeeks() {
        const weeks = initializeWeeks();
        const container = document.getElementById('adminWeeksList');
        if (!container) return;
        
        container.innerHTML = '';
        
        // Sort numerical key order 1-9
        Object.keys(weeks).sort((a,b) => a - b).forEach(w => {
            const weekData = weeks[w];
            const card = document.createElement('div');
            card.className = `week-toggle-card ${weekData.isOpen ? 'open' : 'closed'}`;
            card.innerHTML = `
                <span><strong>Week ${weekData.weekNumber}</strong></span>
                <span class="status-badge">${weekData.isOpen ? 'OPEN' : 'CLOSED'}</span>
                <button type="button" onclick="toggleWeekStatus(${weekData.weekNumber})" class="btn ${weekData.isOpen ? 'btn-danger' : 'btn-primary'}">
                    ${weekData.isOpen ? 'Close' : 'Open'}
                </button>
            `;
            container.appendChild(card);
        });
    }

    // Toggle Week Open/Closed Status
    window.toggleWeekStatus = function(weekNum) {
        let weeks = initializeWeeks();
        if (weeks[weekNum]) {
            weeks[weekNum].isOpen = !weeks[weekNum].isOpen;
            localStorage.setItem('remedial_weeks', JSON.stringify(weeks));
            renderAdminWeeks();
            populateTeacherWeekDropdown();
        }
    };

    // Add / Update Week via Admin Input
    document.getElementById('addWeekBtn').addEventListener('click', () => {
        const inputVal = parseInt(document.getElementById('newWeekInput').value);
        if (!inputVal || inputVal < 1 || inputVal > 9) {
            alert('Please enter a valid week number between 1 and 9.');
            return;
        }
        
        let weeks = initializeWeeks();
        weeks[inputVal] = { weekNumber: inputVal, isOpen: true }; // Open week when added/selected
        localStorage.setItem('remedial_weeks', JSON.stringify(weeks));
        renderAdminWeeks();
        populateTeacherWeekDropdown();
        document.getElementById('newWeekInput').value = '';
    });

    // Dynamic Population of Teacher Dropdown with OPEN Weeks Only
    function populateTeacherWeekDropdown() {
        const weeks = initializeWeeks();
        const select = document.getElementById('claimWeekSelect');
        if (!select) return;
        
        select.innerHTML = '<option value="">-- Select an Open Week --</option>';
        
        let hasOpenWeeks = false;
        Object.keys(weeks).sort((a,b) => a - b).forEach(w => {
            if (weeks[w].isOpen) {
                hasOpenWeeks = true;
                const option = document.createElement('option');
                option.value = weeks[w].weekNumber;
                option.textContent = `Week ${weeks[w].weekNumber}`;
                select.appendChild(option);
            }
        });

        if (!hasOpenWeeks) {
            const option = document.createElement('option');
            option.value = "";
            option.textContent = "No weeks currently open for claims";
            option.disabled = true;
            select.appendChild(option);
        }
    }

    // Handle Form Submission
    document.getElementById('remedialForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const claim = {
            teacher: document.getElementById('teacherName').value,
            week: document.getElementById('claimWeekSelect').value,
            subject: document.getElementById('subjectName').value,
            date: document.getElementById('sessionDate').value,
            hours: document.getElementById('hoursTaught').value,
            timestamp: new Date().toLocaleString()
        };

        let claimsArr = JSON.parse(localStorage.getItem('remedial_claims')) || [];
        claimsArr.push(claim);
        localStorage.setItem('remedial_claims', JSON.stringify(claimsArr));

        alert(`Claim for Week ${claim.week} successfully submitted!`);
        document.getElementById('remedialForm').reset();
        populateTeacherWeekDropdown();
    });

    // Run Initializations
    document.addEventListener('DOMContentLoaded', () => {
        initializeWeeks();
        renderAdminWeeks();
        populateTeacherWeekDropdown();
    });
</script>
</body>
</html>
