<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Portal - Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .secondary-btn {
            background-color: #6c757d;
        }
        .secondary-btn:hover {
            background-color: #5a6268;
        }
        .step-container {
            display: none;
        }
        .step-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>School Portal</h2>
        
        <!-- Step 1: Email Entry -->
        <div id="email-step" class="step-container active">
            <label for="user-email">Email Address</label>
            <input type="email" id="user-email" placeholder="Enter your email" required>
            <button onclick="checkUserAccount()">Continue</button>
        </div>

        <!-- Step 2A: Login View (Existing User) -->
        <div id="login-step" class="step-container">
            <p>Welcome back! Please enter your password or request an email link.</p>
            <input type="password" id="login-password" placeholder="Password" required>
            <button onclick="handleLogin()">Login</button>
            <button class="secondary-btn" onclick="sendEmailOTP()">Send Verification/Reset Email</button>
        </div>

        <!-- Step 2B: Registration View (New User) -->
        <div id="register-step" class="step-container">
            <p>New account detected. Please create a password to register.</p>
            <input type="password" id="reg-password" placeholder="Create a password" required>
            <button onclick="handleRegister()">Register Account</button>
        </div>
    </div>

    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        // TODO: Replace with your actual Firebase project configuration details
        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBe7YGTE5KgSjQ0__hnHR6Yy-N3R8PJhCY",
  authDomain: "school-portal-66a3e.firebaseapp.com",
  projectId: "school-portal-66a3e",
  storageBucket: "school-portal-66a3e.firebasestorage.app",
  messagingSenderId: "735815282382",
  appId: "1:735815282382:web:b62b353ca93b496c6eaa9f",
  measurementId: "G-4LZC4B86J6"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function switchStep(stepId) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        // Check if user exists when entering email from a new device
        function checkUserAccount() {
            const email = document.getElementById('user-email').value.trim();
            if (!email) {
                alert("Please enter a valid email address.");
                return;
            }

            auth.fetchSignInMethodsForEmail(email)
                .then((methods) => {
                    if (methods.length === 0) {
                        // New user -> Switch to registration
                        switchStep('register-step');
                    } else {
                        // Existing user -> Switch to login
                        switchStep('login-step');
                    }
                })
                .catch((error) => {
                    console.error("Error checking email:", error);
                    alert(error.message);
                });
        }

        // Handle login with existing password
        function handleLogin() {
            const email = document.getElementById('user-email').value.trim();
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Login successful! Welcome back.");
                    // Add your redirection or portal dashboard logic here
                })
                .catch((error) => {
                    alert("Login failed: " + error.message);
                });
        }

        // Handle new account registration
        function handleRegister() {
            const email = document.getElementById('user-email').value.trim();
            const password = document.getElementById('reg-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    userCredential.user.sendEmailVerification();
                    alert("Account registered successfully! A verification email has been sent to your inbox.");
                })
                .catch((error) => {
                    alert("Registration failed: " + error.message);
                });
        }

        // Send email link/OTP verification code mechanism
        function sendEmailOTP() {
            const email = document.getElementById('user-email').value.trim();
            
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert("An email has been sent to " + email + " with secure instructions for this new device.");
                })
                .catch((error) => {
                    alert("Error sending email: " + error.message);
                });
        }
    </script>
</body>
</html>
