<!-- Password Reset Section -->
<div class="card auth-card">
    <h3>Reset Password via Mobile OTP</h3>
    
    <!-- Step 1: Request OTP -->
    <form id="requestOtpForm">
        <div class="form-group">
            <label for="resetPhone">Enter Registered Mobile Number</label>
            <input type="tel" id="resetPhone" required placeholder="+2547XXXXXXXX">
        </div>
        <button type="submit" class="btn-secondary">Send OTP</button>
    </form>

    <!-- Step 2: Verify OTP and Change Password (Hidden by default) -->
    <form id="verifyOtpForm" style="display: none; margin-top: 15px;">
        <div class="form-group">
            <label for="enteredOtp">Enter 4-Digit OTP</label>
            <input type="text" id="enteredOtp" required maxlength="4" placeholder="1234">
        </div>
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required placeholder="Enter new password">
        </div>
        <button type="submit" class="btn-primary">Update Password</button>
    </form>
</div>

<script>
let generatedOtp = '';
let targetPhone = '';

// Step 1: Validate phone and send OTP
document.getElementById('requestOtpForm').addEventListener('submit', function(e) {
    e.preventDefault();
    targetPhone = document.getElementById('resetPhone').value.trim();
    
    let teachers = JSON.parse(localStorage.getItem('schoolTeachers')) || [];
    let teacher = teachers.find(t => t.phone === targetPhone);

    if (!teacher) {
        alert('This mobile number is not registered in the system. Contact the admin.');
        return;
    }

    // Generate a random 4-digit OTP
    generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
    
    // In a production app, you would integrate an SMS gateway API here (e.g., Africa's Talking)
    // For simulation purposes, we display it in an alert:
    alert(`[SMS Gateway Simulation] Your OTP code is: ${generatedOtp}`);

    // Switch form views
    document.getElementById('requestOtpForm').style.display = 'none';
    document.getElementById('verifyOtpForm').style.display = 'block';
});

// Step 2: Verify OTP and save new password
document.getElementById('verifyOtpForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const userOtp = document.getElementById('enteredOtp').value.trim();
    const newPassword = document.getElementById('newPassword').value;

    if (userOtp !== generatedOtp) {
        alert('Invalid OTP code. Please try again.');
        return;
    }

    let teachers = JSON.parse(localStorage.getItem('schoolTeachers')) || [];
    let teacherIndex = teachers.findIndex(t => t.phone === targetPhone);

    if (teacherIndex !== -1) {
        teachers[teacherIndex].password = newPassword;
        localStorage.setItem('schoolTeachers', JSON.stringify(teachers));
        alert('Password successfully updated! You can now log in with your new password.');
        
        // Reset forms
        document.getElementById('verifyOtpForm').reset();
        document.getElementById('verifyOtpForm').style.display = 'none';
        document.getElementById('requestOtpForm').style.display = 'block';
        document.getElementById('requestOtpForm').reset();
    }
});
</script>
